name: Build and Deploy Static Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewlab-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Fetch, Build, Validate, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Temporary compatibility step until package-lock.json is generated and committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch Blogger posts and build the static site
        run: node fetch.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html || { echo "ERROR: _site/index.html is missing or empty."; exit 1; }
          test -s _site/sitemap.xml || { echo "ERROR: _site/sitemap.xml is missing or empty."; exit 1; }
          echo "Generated site validation passed."
          echo "HTML files: $(find _site -type f -name '*.html' | wc -l)"
          echo "Total generated files: $(find _site -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy _site --project-name=reviewlab --branch=main
