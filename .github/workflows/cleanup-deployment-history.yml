name: Cleanup Old Deployment History

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually delete old history (leave unchecked for preview only)'
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  deployments: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preview or delete old GitHub and Cloudflare history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: reviewlab
          EXECUTE: ${{ inputs.execute }}
        run: |
          node --input-type=module <<'NODE'
          const execute = process.env.EXECUTE === 'true';
          const repo = process.env.GH_REPOSITORY;
          const ghHeaders = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
          };
          const cfHeaders = {
            Authorization: `Bearer ${process.env.CF_API_TOKEN}`,
            'Content-Type': 'application/json'
          };
          if (!process.env.CF_API_TOKEN || !process.env.CF_ACCOUNT_ID) {
            throw new Error('Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret. Nothing was deleted.');
          }
          async function request(url, headers, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const raw = await response.text();
            let data;
            try { data = raw ? JSON.parse(raw) : {}; } catch { data = { raw }; }
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${url} failed (${response.status}): ${raw.slice(0, 700)}`);
            return { data, headers: response.headers };
          }
          async function ghPages(path) {
            const all = [];
            for (let page = 1; ; page++) {
              const { data } = await request(`https://api.github.com/repos/${repo}/${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`, ghHeaders);
              const rows = Array.isArray(data) ? data : (data.workflow_runs || []);
              all.push(...rows);
              if (rows.length < 100) break;
            }
            return all;
          }
          async function cfPages(url) {
            const all = [];
            for (let page = 1; ; page++) {
              const { data } = await request(`${url}${url.includes('?') ? '&' : '?'}per_page=25&page=${page}`, cfHeaders);
              if (!data.success) throw new Error(`Cloudflare API error: ${JSON.stringify(data.errors || [])}`);
              const rows = data.result || [];
              all.push(...rows);
              const totalPages = Number(data.result_info?.total_pages || 0);
              if (totalPages ? page >= totalPages : rows.length < 25) break;
            }
            return all;
          }
          const runData = await request(`https://api.github.com/repos/${repo}/actions/runs?per_page=100`, ghHeaders);
          const runs = [...(runData.data.workflow_runs || [])];
          for (let page = 2; page <= Math.ceil((runData.data.total_count || 0) / 100); page++) {
            const { data } = await request(`https://api.github.com/repos/${repo}/actions/runs?per_page=100&page=${page}`, ghHeaders);
            runs.push(...(data.workflow_runs || []));
          }
          const completedRuns = runs.filter(r => r.status === 'completed');
          const githubDeployments = await ghPages('deployments');
          const prodGithub = githubDeployments.filter(d => String(d.environment || '').toLowerCase() === 'production')
            .sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at));
          const keepGithubId = prodGithub[0]?.id;
          const oldGithubDeployments = githubDeployments.filter(d => d.id !== keepGithubId);
          const cfBase = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/pages/projects/${process.env.CF_PROJECT_NAME}/deployments`;
          const cfDeployments = await cfPages(cfBase);
          const prodCf = cfDeployments.filter(d => d.environment === 'production')
            .sort((a,b) => Date.parse(b.created_on) - Date.parse(a.created_on));
          if (cfDeployments.length && !prodCf.length) throw new Error('Safety stop: Cloudflare returned deployments but no production deployment. Nothing was deleted.');
          const keepCfId = prodCf[0]?.id;
          const oldCfDeployments = cfDeployments.filter(d => d.id !== keepCfId);
          console.log(`Mode: ${execute ? 'DELETE' : 'DRY RUN — NO DELETIONS'}`);
          console.log(`GitHub completed Actions runs to delete: ${completedRuns.length}`);
          console.log(`Older GitHub deployment records to delete: ${oldGithubDeployments.length}`);
          console.log(`Cloudflare Pages deployments to delete: ${oldCfDeployments.length}`);
          if (keepGithubId) console.log(`Preserving newest GitHub production record: ${keepGithubId}`);
          if (keepCfId) console.log(`Preserving newest Cloudflare production deployment: ${keepCfId}`);
          if (!execute) {
            console.log('Preview complete. Re-run from Actions and check the execute box only after reviewing these counts.');
            process.exit(0);
          }
          for (const run of completedRuns) {
            try {
              await request(`https://api.github.com/repos/${repo}/actions/runs/${run.id}`, ghHeaders, { method: 'DELETE' });
              console.log(`Deleted GitHub Actions run ${run.id}`);
            } catch (e) { console.warn(`Could not delete Actions run ${run.id}: ${e.message}`); }
          }
          for (const deployment of oldGithubDeployments) {
            try {
              const { data: statuses } = await request(`https://api.github.com/repos/${repo}/deployments/${deployment.id}/statuses?per_page=1`, ghHeaders);
              if (!statuses[0] || statuses[0].state !== 'inactive') {
                await request(`https://api.github.com/repos/${repo}/deployments/${deployment.id}/statuses`, ghHeaders, {
                  method: 'POST', body: JSON.stringify({ state: 'inactive', description: 'Historical deployment cleanup' })
                });
              }
              await request(`https://api.github.com/repos/${repo}/deployments/${deployment.id}`, ghHeaders, { method: 'DELETE' });
              console.log(`Deleted GitHub deployment record ${deployment.id}`);
            } catch (e) { console.warn(`Could not delete GitHub deployment ${deployment.id}: ${e.message}`); }
          }
          for (const deployment of oldCfDeployments) {
            try {
              const { data } = await request(`${cfBase}/${deployment.id}?force=true`, cfHeaders, { method: 'DELETE' });
              if (!data.success) throw new Error(JSON.stringify(data.errors || []));
              console.log(`Deleted Cloudflare deployment ${deployment.id} (${deployment.environment})`);
            } catch (e) { console.warn(`Could not delete Cloudflare deployment ${deployment.id}: ${e.message}`); }
          }
          console.log('Cleanup finished. The newest production deployment on Cloudflare was preserved. Check warnings above for any records the APIs refused to delete.');
          NODE
